<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>아이디어정리</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/nikola-tesla.png" />
    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/controls.css" />
    <link rel="stylesheet" href="/style/sidebar.css" />
    <link rel="stylesheet" href="/style/layout.css" />
    <link rel="stylesheet" href="/style/list.css" />
    <link rel="stylesheet" href="/style/work.css" />
    <link rel="stylesheet" href="/style/summary.css" />
    <link rel="stylesheet" href="/style/logic.css" />
    <link rel="stylesheet" href="/style/sheet.css" />
    <link rel="stylesheet" href="/style/captures.css" />
    <link rel="stylesheet" href="/style/viewer.css" />
    <link rel="stylesheet" href="/style/dialogs.css" />
    <link rel="stylesheet" href="/style/narrow.css" />
    <link rel="stylesheet" href="/style/print.css" />
    <link rel="stylesheet" href="/style/motion.css" />
    <script type="module" src="/app/main.mjs"></script>
  </head>
  <body>
    <aside class="sidebar" aria-label="메뉴">
      <button id="home" type="button" class="brand" aria-label="아이디어정리, 전체 작품으로" title="전체 작품으로">
        <span class="mark" aria-hidden="true">
          <img src="/nikola-tesla.png" width="38" height="38" alt="" />
          <span class="brand-spark"></span>
        </span>
        아이디어정리
      </button>
      <p id="build" class="build" title="앱 빌드 번호"></p>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="작품 메뉴" aria-controls="sidenav health" aria-expanded="false">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="sidenav" class="sidenav" aria-label="작품 메뉴"></nav>
      <button type="button" class="model-settings-link" data-action="forms-settings">공모 연동 설정</button>
      <button type="button" class="model-settings-link" data-action="summary-settings">요약 설정</button>
      <button type="button" class="model-settings-link" data-action="self-check">운영 맥 점검</button>
      <div id="health" aria-live="polite">엔진 확인 중</div>
    </aside>
    <main id="main" tabindex="-1"></main>
    <aside id="evidence" class="evidence" aria-label="원문 근거" hidden></aside>
    <dialog id="dialog" aria-labelledby="dialogtitle">
      <div class="dialoghead">
        <h2 id="dialogtitle"></h2>
        <button id="close" type="button" class="iconbtn" aria-label="닫기">
          <svg
            class="icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="dialogbody"></div>
    </dialog>
    <div id="notice" role="status" hidden></div>
  </body>
</html>
